services:
  mysql:
    image: mysql:8.4
    container_name: careerpilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: careerpilot
    ports:
      - "3306:3306"
    volumes:
      - careerpilot_data:/var/lib/mysql
volumes:
  careerpilot_data:
